
name: Test Stockfish MCP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Test Docker build
        run: docker build -t mcp-stockfish .

      - name: Test authenticated MCP server
        run: |
          docker run -d --name stockfish-test \
            -e MCP_STOCKFISH_SERVER_MODE=http \
            -e MCP_STOCKFISH_HTTP_HOST=0.0.0.0 \
            -e MCP_STOCKFISH_HTTP_PORT=8080 \
            -e MCP_STOCKFISH_PATH=/usr/bin/stockfish \
            -e AUTH0_AUDIENCE=https://stockfish-mcp \
            -p 8080:8080 \
            mcp-stockfish

          echo "Waiting for Stockfish server..."

          READY=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Server did not start"
            docker logs stockfish-test
            exit 1
          fi

          echo ""
          echo "Testing health endpoint..."

          HEALTH=$(curl -sS -o /dev/null \
            -w '%{http_code}' \
            http://localhost:8080/health)

          echo "Health HTTP status: $HEALTH"
          test "$HEALTH" = "200"

          echo "Testing unauthorized MCP access..."

          STATUS=$(curl -sS \
            -o /tmp/unauthorized.txt \
            -w '%{http_code}' \
            http://localhost:8080/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"security-test","version":"1.0"}}}')

          echo "MCP HTTP status: $STATUS"
          cat /tmp/unauthorized.txt

          if [ "$STATUS" != "401" ]; then
            echo "SECURITY TEST FAILED"
            exit 1
          fi

          echo ""
          echo "SUCCESS: Unauthenticated MCP access blocked!"
          echo "SUCCESS: Health endpoint working!"
          echo "SUCCESS: Authentication middleware active!"

          docker stop stockfish-test

      - name: Show container logs on failure
        if: failure()
        run: docker logs stockfish-test 2>&1 || true
